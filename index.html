    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, collection, onSnapshot, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Firebase state & listeners
        window.firebaseApp = null;
        window.firebaseDb = null;
        window.firebaseAuth = null;
        window.unsubscribeRoom = null;

        // URLパラメータからのルームID優先読み込み
        const urlParams = new URLSearchParams(window.location.search);
        const roomFromUrl = urlParams.get('room');
        if (roomFromUrl) {
            localStorage.setItem('active_room_id', roomFromUrl);
        }

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'rainbow-order-shared-app';
        window.appId = appId;

        // Firebase Config Setup
        let firebaseConfig = null;
        if (typeof __firebase_config !== 'undefined') {
            try { firebaseConfig = JSON.parse(__firebase_config); } catch(e) {}
        }

        if (firebaseConfig) {
            window.firebaseApp = initializeApp(firebaseConfig);
            window.firebaseDb = getFirestore(window.firebaseApp);
            window.firebaseAuth = getAuth(window.firebaseApp);

            // Authentication Setup
            const initAuth = async () => {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(window.firebaseAuth, __initial_auth_token);
                    } else {
                        await signInAnonymously(window.firebaseAuth);
                    }
                    console.log("Firebase Auth Connected:", window.firebaseAuth.currentUser?.uid);
                    window.dispatchEvent(new CustomEvent('firebase-ready'));
                } catch (err) {
                    console.error("Firebase Auth Error:", err);
                    window.dispatchEvent(new CustomEvent('firebase-error', { detail: err }));
                }
            };
            initAuth();
        } else {
            console.warn("Firebase Config not supplied. Using local fallback.");
        }

        // Firebase Sync Helper Functions
        window.subscribeToRoomRealtime = function(roomId, onDataReceived) {
            if (window.unsubscribeRoom) {
                window.unsubscribeRoom();
                window.unsubscribeRoom = null;
            }

            if (!window.firebaseDb || !window.firebaseAuth?.currentUser) {
                // Fallback to local storage
                onDataReceived(getRoomRecords(roomId));
                return;
            }

            // Public path
            const colRef = collection(window.firebaseDb, 'artifacts', window.appId, 'public', 'data', `room_${roomId}_records`);

            window.unsubscribeRoom = onSnapshot(colRef, (snapshot) => {
                const fetchedRecords = [];
                snapshot.forEach((docSnap) => {
                    fetchedRecords.push(docSnap.data());
                });
                fetchedRecords.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                onDataReceived(fetchedRecords);
            }, (error) => {
                console.error("Firestore Snapshot Error:", error);
                const dot = document.getElementById('syncStatusDot');
                const text = document.getElementById('syncStatusText');
                if (dot) dot.className = "inline-block w-2 h-2 rounded-full bg-rose-500";
                if (text) text.textContent = "同期エラー (ローカル表示中)";
                onDataReceived(getRoomRecords(roomId));
            });
        };

        window.saveRecordToCloud = async function(roomId, record) {
            if (!window.firebaseDb || !window.firebaseAuth?.currentUser) return;
            try {
                const docRef = doc(window.firebaseDb, 'artifacts', window.appId, 'public', 'data', `room_${roomId}_records`, record.id);
                await setDoc(docRef, record);
            } catch (e) {
                console.error("Error saving record:", e);
            }
        };

        window.deleteRecordFromCloud = async function(roomId, recordId) {
            if (!window.firebaseDb || !window.firebaseAuth?.currentUser) return;
            try {
                const docRef = doc(window.firebaseDb, 'artifacts', window.appId, 'public', 'data', `room_${roomId}_records`, recordId);
                await deleteDoc(docRef);
            } catch (e) {
                console.error("Error deleting record:", e);
            }
        };
    </script>

                </h2>

                <div id="adminFilterWrapper" class="hidden">
                    <select id="filterBuyer" class="bg-white border border-slate-200 rounded-xl px-2.5 py-1 text-xs text-slate-600 font-medium shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="ALL">全員の明細を表示</option>
                    </select>
                </div>
            </div>

            <div id="recordsList" class="space-y-2">
                <div class="bg-white p-6 rounded-2xl text-center text-xs text-slate-400 border border-slate-200/80">
                    明細はありません
                </div>
            </div>
        </section>

        <!-- Admin Actions Bar -->
        <section id="adminActionsSection" class="hidden space-y-2 pt-2">
            <button id="createNewRoomBtn" class="w-full flex items-center justify-center gap-2 p-3 bg-blue-600 text-white rounded-2xl font-bold text-xs shadow-md shadow-blue-500/20 active:scale-95 transition-all">
                <i class="fa-solid fa-plus-circle text-sm"></i>
                新しいルームを作成する
            </button>
            <div class="grid grid-cols-2 gap-2">
                <button id="copySummaryBtn" class="flex items-center justify-center gap-2 p-3 bg-emerald-50 text-emerald-700 border border-emerald-200/80 hover:bg-emerald-100 rounded-2xl font-bold text-xs active:scale-95 transition-all">
                    <i class="fa-solid fa-copy text-sm"></i>
                    LINE用テキストコピー
                </button>
                <button id="exportCsvBtn" class="flex items-center justify-center gap-2 p-3 bg-slate-100 text-slate-700 border border-slate-200 hover:bg-slate-200 rounded-2xl font-bold text-xs active:scale-95 transition-all">
                    <i class="fa-solid fa-file-csv text-sm"></i>
                    CSVダウンロード
                </button>
            </div>
            <button id="changePasscodeBtn" class="w-full border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 rounded-2xl py-2.5 font-bold text-xs transition-all flex items-center justify-center gap-1.5 mt-2">
                <i class="fa-solid fa-key text-slate-400"></i>
                パスコードの変更
            </button>
        </section>

    </main>

    <!-- Modals & Toasts -->
    <div id="customModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-xs w-full p-5 space-y-4 shadow-xl border border-slate-100">
            <h3 id="modalTitle" class="font-bold text-slate-900 text-base text-center"></h3>
            <div id="modalBody" class="text-xs text-slate-600 space-y-2"></div>
            <div id="modalActions" class="flex gap-2 pt-2"></div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-lg backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300 flex items-center gap-2">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMsg">処理完了</span>
    </div>

    <!-- Application Controller Script -->
    <script>
        // State variables
        let activeRoomId = localStorage.getItem('active_room_id') || 'main_room';
        let availableRooms = JSON.parse(localStorage.getItem('rainbow_rooms_list') || '[]');
        if (availableRooms.length === 0) {
            availableRooms = [{ id: 'main_room', name: 'メインルーム', createdAt: new Date().toISOString() }];
            localStorage.setItem('rainbow_rooms_list', JSON.stringify(availableRooms));
        }

        let isAdminMode = false;
        let entryPasscode = localStorage.getItem('app_entry_passcode') || "0516";
        let adminPasscode = localStorage.getItem('app_admin_passcode') || "1234";
        let isAppUnlocked = sessionStorage.getItem('app_is_unlocked') === 'true';
        let records = [];

        // DOM Elements
        const appLockOverlay = document.getElementById('appLockOverlay');
        const entryPasscodeCode = document.getElementById('entryPasscodeCode');
        const unlockAppBtn = document.getElementById('unlockAppBtn');
        const entryErrorMsg = document.getElementById('entryErrorMsg');

        const roomIdDisplay = document.getElementById('roomIdDisplay');
        const buyerInput = document.getElementById('buyerInput');
        const buyerSelect = document.getElementById('buyerSelect');
        const itemsContainer = document.getElementById('itemsContainer');
        const addRowBtn = document.getElementById('addRowBtn');
        const formTotalPreview = document.getElementById('formTotalPreview');
        const multiPurchaseForm = document.getElementById('multiPurchaseForm');
        
        const modeToggleBtn = document.getElementById('modeToggleBtn');
        const modeText = document.getElementById('modeText');
        const modeIcon = document.getElementById('modeIcon');
        const userSummaryCard = document.getElementById('userSummaryCard');
        const adminSummaryCard = document.getElementById('adminSummaryCard');
        const adminActionsSection = document.getElementById('adminActionsSection');
        const adminFilterWrapper = document.getElementById('adminFilterWrapper');
        const recordsTitle = document.getElementById('recordsTitle');

        const myTotalAmount = document.getElementById('myTotalAmount');
        const myTotalQty = document.getElementById('myTotalQty');
        const myRecordCount = document.getElementById('myRecordCount');
        const myBuyerNameBadge = document.getElementById('myBuyerNameBadge');

        const grandTotalAmount = document.getElementById('grandTotalAmount');
        const grandTotalQuantity = document.getElementById('grandTotalQuantity');
        const personSummaryList = document.getElementById('personSummaryList');
        const personCountTag = document.getElementById('personCountTag');
        const filterBuyer = document.getElementById('filterBuyer');
        const recordsList = document.getElementById('recordsList');

        // MODE SWITCHING & UI FUNCTIONS
        function toggleMode() {
            if (isAdminMode) {
                isAdminMode = false;
                updateModeUI();
            } else {
                showModal({
                    title: "管理者モード認証",
                    body: `
                        <div class="space-y-2">
                            <p class="text-slate-500 text-center">管理者用パスコードを入力してください</p>
                            <input type="password" id="adminPassInput" placeholder="••••" maxlength="12"
                                class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-center text-base font-bold tracking-widest focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    `,
                    actions: [
                        { label: "キャンセル", type: "secondary", onClick: closeModal },
                        {
                            label: "認証",
                            type: "primary",
                            onClick: () => {
                                const pass = document.getElementById('adminPassInput').value.trim();
                                if (pass === adminPasscode) {
                                    isAdminMode = true;
                                    closeModal();
                                    updateModeUI();
                                    showToast("管理者モードに切り替えました", "fa-shield-halved text-amber-400");
                                } else {
                                    showToast("パスコードが違います", "fa-circle-xmark text-rose-400");
                                }
                            }
                        }
                    ]
                });
            }
        }

        function updateModeUI() {
            if (isAdminMode) {
                modeText.textContent = "管理者モード";
                modeIcon.className = "fa-solid fa-shield-halved text-amber-500";
                adminSummaryCard.classList.remove('hidden');
                adminActionsSection.classList.remove('hidden');
                adminFilterWrapper.classList.remove('hidden');
                recordsTitle.textContent = "全体データ管理";
            } else {
                modeText.textContent = "一般モード";
                modeIcon.className = "fa-solid fa-user text-blue-600";
                adminSummaryCard.classList.add('hidden');
                adminActionsSection.classList.add('hidden');
                adminFilterWrapper.classList.add('hidden');
                recordsTitle.textContent = "自分の登録済み明細";
            }
            renderAll();
        }

        // ROOM SELECT & MODAL FUNCTIONS
        function openRoomSelectModal() {
            const roomListHtml = availableRooms.map(r => `
                <div class="p-3 bg-slate-50 hover:bg-slate-100 rounded-xl flex justify-between items-center cursor-pointer transition-colors ${r.id === activeRoomId ? 'border-2 border-blue-500 font-bold' : 'border border-slate-200'}"
                     onclick="switchRoom('${r.id}')">
                    <span class="text-xs text-slate-800">${escapeHtml(r.name)}</span>
                    ${r.id === activeRoomId ? '<i class="fa-solid fa-check text-blue-600 text-xs"></i>' : ''}
                </div>
            `).join('');

            showModal({
                title: "ルーム選択",
                body: `<div class="space-y-2 max-h-60 overflow-y-auto">${roomListHtml}</div>`,
                actions: [
                    { label: "閉じる", type: "secondary", onClick: closeModal }
                ]
            });
        }

        window.switchRoom = function(roomId) {
            activeRoomId = roomId;
            localStorage.setItem('active_room_id', roomId);
            closeModal();
            loadRoomData(roomId);
            showToast("ルームを切り替えました", "fa-layer-group text-blue-400");
        };

        function openCreateRoomModal() {
            showModal({
                title: "新規ルーム作成",
                body: `
                    <div class="space-y-2">
                        <label class="block text-xs text-slate-600 font-bold">ルーム名</label>
                        <input type="text" id="newRoomNameInput" placeholder="例: 5月買付用"
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                `,
                actions: [
                    { label: "キャンセル", type: "secondary", onClick: closeModal },
                    {
                        label: "作成",
                        type: "primary",
                        onClick: () => {
                            const name = document.getElementById('newRoomNameInput').value.trim();
                            if (!name) {
                                showToast("ルーム名を入力してください", "fa-triangle-exclamation text-amber-400");
                                return;
                            }
                            const newRoom = {
                                id: 'room_' + Date.now(),
                                name: name,
                                createdAt: new Date().toISOString()
                            };
                            availableRooms.push(newRoom);
                            localStorage.setItem('rainbow_rooms_list', JSON.stringify(availableRooms));
                            closeModal();
                            switchRoom(newRoom.id);
                        }
                    }
                ]
            });
        }

        function checkAppLockState() {
            if (isAppUnlocked) {
                appLockOverlay.classList.add('hidden');
            } else {
                appLockOverlay.classList.remove('hidden');
            }
        }

        function tryUnlockApp() {
            const inputVal = entryPasscodeCode.value.trim();
            if (inputVal === entryPasscode) {
                isAppUnlocked = true;
                sessionStorage.setItem('app_is_unlocked', 'true');
                entryErrorMsg.classList.add('hidden');
                entryPasscodeCode.value = '';
                checkAppLockState();
                showToast("ロックを解除しました", "fa-lock-open text-emerald-400");
            } else {
                entryErrorMsg.classList.remove('hidden');
                entryPasscodeCode.value = '';
            }
        }

        function getRoomRecords(roomId) {
            try {
                const raw = localStorage.getItem(`local_room_data_${roomId}`);
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                return [];
            }
        }

        function saveRoomRecords(roomId, data) {
            try {
                localStorage.setItem(`local_room_data_${roomId}`, JSON.stringify(data));
            } catch (e) {}
        }

        function loadRoomData(roomId) {
            updateRoomBadge();

            if (typeof window.subscribeToRoomRealtime === 'function') {
                window.subscribeToRoomRealtime(roomId, (cloudRecords) => {
                    records = cloudRecords;
                    saveRoomRecords(roomId, records);
                    renderAll();
                });
            } else {
                records = getRoomRecords(roomId);
                renderAll();
            }
        }

        function updateRoomBadge() {
            const found = availableRooms.find(r => r.id === activeRoomId);
            roomIdDisplay.textContent = found ? found.name : 'メインルーム';
        }

        function addNewItemRow() {
            const rowId = 'row_' + Date.now() + Math.random().toString(36).substring(2, 5);
            const row = document.createElement('div');
            row.className = 'item-row flex items-center gap-2 bg-slate-50 p-2 rounded-xl border border-slate-200/80';
            row.id = rowId;

            row.innerHTML = `
                <input type="text" placeholder="商品名 (例: 缶バッジ)" class="item-name flex-1 bg-white border border-slate-200 rounded-lg p-2 text-xs font-medium focus:outline-none focus:ring-1 focus:ring-blue-500">
                <input type="number" placeholder="金額" class="item-price w-20 bg-white border border-slate-200 rounded-lg p-2 text-xs font-medium focus:outline-none focus:ring-1 focus:ring-blue-500 text-right" min="0">
                <div class="flex items-center bg-white border border-slate-200 rounded-lg p-1">
                    <button type="button" class="qty-minus w-5 h-5 flex items-center justify-center text-slate-500 hover:text-slate-800 text-xs">-</button>
                    <input type="number" value="1" min="1" class="item-qty w-7 text-center text-xs font-bold focus:outline-none">
                    <button type="button" class="qty-plus w-5 h-5 flex items-center justify-center text-slate-500 hover:text-slate-800 text-xs">+</button>
                </div>
                <button type="button" class="remove-row-btn text-slate-400 hover:text-rose-500 p-1 text-xs">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            `;

            itemsContainer.appendChild(row);

            const nameInput = row.querySelector('.item-name');
            const priceInput = row.querySelector('.item-price');
            const qtyInput = row.querySelector('.item-qty');
            const minusBtn = row.querySelector('.qty-minus');
            const plusBtn = row.querySelector('.qty-plus');
            const removeBtn = row.querySelector('.remove-row-btn');

            const calculateFormTotal = () => {
                let total = 0;
                document.querySelectorAll('.item-row').forEach(r => {
                    const price = parseFloat(r.querySelector('.item-price').value) || 0;
                    const qty = parseInt(r.querySelector('.item-qty').value) || 1;
                    total += price * qty;
                });
                formTotalPreview.textContent = `¥${total.toLocaleString()}`;
            };

            nameInput.addEventListener('input', calculateFormTotal);
            priceInput.addEventListener('input', calculateFormTotal);
            qtyInput.addEventListener('input', calculateFormTotal);

            minusBtn.addEventListener('click', () => {
                let val = parseInt(qtyInput.value) || 1;
                if (val > 1) {
                    qtyInput.value = val - 1;
                    calculateFormTotal();
                }
            });

            plusBtn.addEventListener('click', () => {
                let val = parseInt(qtyInput.value) || 1;
                qtyInput.value = val + 1;
                calculateFormTotal();
            });

            removeBtn.addEventListener('click', () => {
                if (document.querySelectorAll('.item-row').length > 1) {
                    row.remove();
                    calculateFormTotal();
                } else {
                    showToast("最低1つの行が必要です", "fa-triangle-exclamation text-amber-400");
                }
            });
        }

        function resetForm() {
            itemsContainer.innerHTML = '';
            addNewItemRow();
            formTotalPreview.textContent = '¥0';
        }

        function renderAll() {
            renderUserSummary();
            renderAdminSummary();
            renderBuyerSelectOptions();
            renderRecordsList();
        }

        function renderUserSummary() {
            const currentBuyer = buyerInput.value.trim();
            myBuyerNameBadge.textContent = currentBuyer || '未設定';

            const myRecords = records.filter(r => r.buyer === currentBuyer);
            let totalAmt = 0;
            let totalQty = 0;

            myRecords.forEach(r => {
                totalAmt += r.price * r.qty;
                totalQty += r.qty;
            });

            myTotalAmount.textContent = `¥${totalAmt.toLocaleString()}`;
            myTotalQty.textContent = totalQty;
            myRecordCount.textContent = `${myRecords.length}件`;
        }

        function renderAdminSummary() {
            if (!isAdminMode) return;

            let grandAmt = 0;
            let grandQty = 0;
            const personMap = {};
            const productMap = {};

            records.forEach(r => {
                const subtotal = r.price * r.qty;
                grandAmt += subtotal;
                grandQty += r.qty;

                if (!personMap[r.buyer]) {
                    personMap[r.buyer] = { qty: 0, amount: 0 };
                }
                personMap[r.buyer].qty += r.qty;
                personMap[r.buyer].amount += subtotal;

                const prodName = r.adminItem || r.item || '未分類';
                if (!productMap[prodName]) {
                    productMap[prodName] = { qty: 0, amount: 0 };
                }
                productMap[prodName].qty += r.qty;
                productMap[prodName].amount += subtotal;
            });

            grandTotalAmount.textContent = `¥${grandAmt.toLocaleString()}`;
            grandTotalQuantity.textContent = grandQty;

            const productKeys = Object.keys(productMap);
            const productSummaryList = document.getElementById('productSummaryList');
            const productCountTag = document.getElementById('productCountTag');
            productCountTag.textContent = `${productKeys.length}種`;

            if (productKeys.length === 0) {
                productSummaryList.innerHTML = '<div class="p-3 text-center text-xs text-slate-400">データがありません</div>';
            } else {
                productSummaryList.innerHTML = productKeys.map(key => `
                    <div class="p-3 flex items-center justify-between text-xs hover:bg-slate-50 transition-colors">
                        <div class="font-bold text-slate-800">${escapeHtml(key)}</div>
                        <div class="text-right">
                            <span class="font-bold text-indigo-600">${productMap[key].qty} 個</span>
                            <span class="text-slate-400 text-[11px] ml-1.5">(¥${productMap[key].amount.toLocaleString()})</span>
                        </div>
                    </div>
                `).join('');
            }

            const personKeys = Object.keys(personMap);
            personCountTag.textContent = `${personKeys.length}名`;

            if (personKeys.length === 0) {
                personSummaryList.innerHTML = '<div class="p-3 text-center text-xs text-slate-400">データがありません</div>';
            } else {
                personSummaryList.innerHTML = personKeys.map(key => `
                    <div class="p-3 flex items-center justify-between text-xs hover:bg-slate-50 transition-colors">
                        <div class="font-bold text-slate-800 flex items-center gap-1.5">
                            <i class="fa-solid fa-user text-slate-400 text-[10px]"></i>
                            <span>${escapeHtml(key)}</span>
                        </div>
                        <div class="text-right">
                            <span class="font-black text-slate-900">¥${personMap[key].amount.toLocaleString()}</span>
                            <span class="text-slate-400 text-[11px] ml-1">(${personMap[key].qty}点)</span>
                        </div>
                    </div>
                `).join('');
            }
        }

        function renderBuyerSelectOptions() {
            const buyers = Array.from(new Set(records.map(r => r.buyer))).filter(Boolean);
            
            buyerSelect.innerHTML = '<option value="">履歴から選択</option>' + 
                buyers.map(b => `<option value="${escapeHtml(b)}">${escapeHtml(b)}</option>`).join('');

            filterBuyer.innerHTML = '<option value="ALL">全員の明細を表示</option>' + 
                buyers.map(b => `<option value="${escapeHtml(b)}">${escapeHtml(b)}のみ表示</option>`).join('');
        }

        function renderRecordsList() {
            const currentBuyer = buyerInput.value.trim();
            const selectedFilter = filterBuyer.value;

            let displayRecords = [];

            if (isAdminMode) {
                if (selectedFilter === 'ALL') {
                    displayRecords = [...records];
                } else {
                    displayRecords = records.filter(r => r.buyer === selectedFilter);
                }
            } else {
                displayRecords = records.filter(r => r.buyer === currentBuyer);
            }

            if (displayRecords.length === 0) {
                recordsList.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl text-center text-xs text-slate-400 border border-slate-200/80">
                        ${isAdminMode ? '登録されている明細はありません' : 'あなたの登録済み明細はありません'}
                    </div>
                `;
                return;
            }

            recordsList.innerHTML = displayRecords.map(r => `
                <div class="bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between gap-3">
                    <div class="min-w-0 flex-1">
                        <div class="flex items-center gap-2 mb-1">
                            ${isAdminMode ? `<span class="bg-blue-50 text-blue-700 text-[10px] font-bold px-2 py-0.5 rounded-full">${escapeHtml(r.buyer)}</span>` : ''}
                            <span class="font-bold text-xs text-slate-800 truncate">${escapeHtml(r.item)}</span>
                        </div>
                        <div class="text-[11px] text-slate-500 flex items-center gap-2">
                            <span>単価: ¥${r.price.toLocaleString()}</span>
                            <span>×</span>
                            <span>数量: ${r.qty}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-3 flex-shrink-0">
                        <div class="text-right">
                            <span class="font-black text-slate-900 text-sm">¥${(r.price * r.qty).toLocaleString()}</span>
                        </div>
                        <button onclick="confirmDelete('${r.id}')" class="p-2 text-slate-300 hover:text-rose-500 transition-colors">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        window.confirmDelete = function(recordId) {
            showModal({
                title: "明細の削除",
                body: "<p class='text-center text-slate-600'>この明細を削除してもよろしいですか？</p>",
                actions: [
                    { label: "キャンセル", type: "secondary", onClick: closeModal },
                    {
                        label: "削除",
                        type: "danger",
                        onClick: () => {
                            if (window.deleteRecordFromCloud) {
                                window.deleteRecordFromCloud(activeRoomId, recordId);
                            }
                            records = records.filter(r => r.id !== recordId);
                            saveRoomRecords(activeRoomId, records);
                            closeModal();
                            renderAll();
                            showToast("明細を削除しました", "fa-trash-can text-rose-400");
                        }
                    }
                ]
            });
        };

        // INITIALIZATION
        window.addEventListener('DOMContentLoaded', () => {
            // PNG icon conversion for iOS home screen icon
            try {
                const svgString = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><rect width='200' height='200' fill='white'/><g transform='translate(100,100)'><g transform='translate(0,-68)'><path d='M0,-12 C-6,-22 -20,-16 -20,-2 C-20,10 0,22 0,22 C0,22 20,10 20,-2 C20,-16 6,-22 0,-12 Z' fill='#d93829'/></g><g transform='rotate(51.4) translate(0,-68)'><path d='M0,-12 C-6,-22 -20,-16 -20,-2 C-20,10 0,22 0,22 C0,22 20,10 20,-2 C20,-16 6,-22 0,-12 Z' fill='#e88732'/></g><g transform='rotate(102.8) translate(0,-68)'><path d='M0,-12 C-6,-22 -20,-16 -20,-2 C-20,10 0,22 0,22 C0,22 20,10 20,-2 C20,-16 6,-22 0,-12 Z' fill='#f1cf47'/></g><g transform='rotate(154.2) translate(0,-68)'><path d='M0,-12 C-6,-22 -20,-16 -20,-2 C-20,10 0,22 0,22 C0,22 20,10 20,-2 C20,-16 6,-22 0,-12 Z' fill='#226a3c'/></g><g transform='rotate(205.7) translate(0,-68)'><path d='M0,-12 C-6,-22 -20,-16 -20,-2 C-20,10 0,22 0,22 C0,22 20,10 20,-2 C20,-16 6,-22 0,-12 Z' fill='#3fb1e5'/></g><g transform='rotate(257.1) translate(0,-68)'><path d='M0,-12 C-6,-22 -20,-16 -20,-2 C-20,10 0,22 0,22 C0,22 20,10 20,-2 C20,-16 6,-22 0,-12 Z' fill='#282b82'/></g><g transform='rotate(308.5) translate(0,-68)'><path d='M0,-12 C-6,-22 -20,-16 -20,-2 C-20,10 0,22 0,22 C0,22 20,10 20,-2 C20,-16 6,-22 0,-12 Z' fill='#5b2e7f'/></g><circle r='44' fill='#d93829' stroke='#111111' stroke-width='6'/><path d='M-25,18 Q0,38 25,18' fill='none' stroke='#111111' stroke-width='6' stroke-linecap='round'/><line x1='-28' y1='14' x2='-22' y2='22' stroke='#111111' stroke-width='6' stroke-linecap='round'/><line x1='28' y1='14' x2='22' y2='22' stroke='#111111' stroke-width='6' stroke-linecap='round'/><rect x='-44' y='-18' width='88' height='26' fill='#111111'/><line x1='-28' y1='-32' x2='-16' y2='-20' stroke='#e85292' stroke-width='5' stroke-linecap='round'/><line x1='-14' y1='-36' x2='-2' y2='-24' stroke='#f1cf47' stroke-width='5' stroke-linecap='round'/><line x1='0' y1='-38' x2='12' y2='-26' stroke='#282b82' stroke-width='5' stroke-linecap='round'/><text x='0' y='-4' font-family='Arial, sans-serif' font-weight='900' font-style='italic' font-size='30' fill='white' text-anchor='middle' dominant-baseline='middle'>N</text></g></svg>`;
                const img = new Image();
                img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 180;
                    canvas.height = 180;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, 180, 180);
                    const pngDataUrl = canvas.toDataURL('image/png');
                    const appleIconElement = document.getElementById('appleTouchIconLink');
                    if (appleIconElement) {
                        appleIconElement.href = pngDataUrl;
                    }
                };
            } catch (e) {}

            const savedBuyer = localStorage.getItem('my_buyer_name');
            if (savedBuyer) {
                buyerInput.value = savedBuyer;
                myBuyerNameBadge.textContent = savedBuyer;
            }

            checkAppLockState();
            addNewItemRow();
            loadRoomData(activeRoomId);
            setupEventListeners();
        });

        function setupEventListeners() {
            unlockAppBtn.addEventListener('click', tryUnlockApp);
            entryPasscodeCode.addEventListener('keyup', (e) => {
                if (e.key === 'Enter') tryUnlockApp();
            });

            modeToggleBtn.addEventListener('click', toggleMode);
            document.getElementById('exitAdminBtn')?.addEventListener('click', () => {
                isAdminMode = false;
                updateModeUI();
            });

            document.getElementById('lockAppBtn').addEventListener('click', () => {
                isAppUnlocked = false;
                sessionStorage.removeItem('app_is_unlocked');
                checkAppLockState();
                showToast("画面をロックしました", "fa-lock text-blue-400");
            });

            document.getElementById('changePasscodeBtn')?.addEventListener('click', () => {
                showModal({
                    title: "パスコード変更",
                    body: `
                        <div class="space-y-3 text-left">
                            <div>
                                <label class="block text-[11px] font-bold text-slate-600 mb-1">閲覧用ロックパスコード</label>
                                <input type="password" id="newEntryPassInput" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-center text-sm font-bold tracking-widest focus:outline-none focus:ring-2 focus:ring-blue-500" value="${escapeHtml(entryPasscode)}" placeholder="0516">
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-slate-600 mb-1">管理者用パスコード</label>
                                <input type="password" id="newAdminPassInput" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-center text-sm font-bold tracking-widest focus:outline-none focus:ring-2 focus:ring-blue-500" value="${escapeHtml(adminPasscode)}" placeholder="1234">
                            </div>
                        </div>
                    `,
                    actions: [
                        { label: "キャンセル", type: "secondary", onClick: closeModal },
                        { 
                            label: "変更を保存", 
                            type: "primary", 
                            onClick: () => {
                                const newEntryPass = document.getElementById('newEntryPassInput').value.trim();
                                const newAdminPass = document.getElementById('newAdminPassInput').value.trim();
                                if (!newEntryPass || !newAdminPass) {
                                    showToast("両方のパスコードを入力してください", "fa-triangle-exclamation text-amber-400");
                                    return;
                                }
                                entryPasscode = newEntryPass;
                                adminPasscode = newAdminPass;
                                localStorage.setItem('app_entry_passcode', newEntryPass);
                                localStorage.setItem('app_admin_passcode', newAdminPass);
                                closeModal();
                                showToast("パスコードを変更しました", "fa-circle-check text-emerald-400");
                            }
                        }
                    ]
                });
            });

            document.getElementById('shareRoomBtn').addEventListener('click', () => {
                // ルームIDを含めたURLを共有用に生成
                const shareUrl = new URL(window.location.href);
                shareUrl.searchParams.set('room', activeRoomId);
                const shareUrlString = shareUrl.toString();

                copyTextToClipboard(shareUrlString);
                
                showModal({
                    title: "URL共有（スマホ連携）",
                    body: `
                        <div class="space-y-3 text-center">
                            <p class="text-xs text-slate-500">このルーム専用の共有URLをコピーしました！<br>スマホで開くと自動的に同じデータが見られます。</p>
                            <div class="flex justify-center p-3 bg-white rounded-2xl border border-slate-100 shadow-inner">
                                <div id="qrcodeCanvas"></div>
                            </div>
                            <input type="text" readonly value="${escapeHtml(shareUrlString)}" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-[11px] text-slate-600 font-mono text-center focus:outline-none">
                        </div>
                    `,
                    actions: [
                        { label: "閉じる", type: "secondary", onClick: closeModal }
                    ]
                });

                setTimeout(() => {
                    const qrContainer = document.getElementById('qrcodeCanvas');
                    if (qrContainer && typeof QRCode !== 'undefined') {
                        new QRCode(qrContainer, {
                            text: shareUrlString,
                            width: 150,
                            height: 150
                        });
                    }
                }, 50);

                showToast("共有URLをコピーしました！", "fa-share-nodes text-blue-400");
            });

            document.getElementById('changeRoomBtn').addEventListener('click', openRoomSelectModal);

            buyerInput.addEventListener('input', (e) => {
                const name = e.target.value.trim();
                localStorage.setItem('my_buyer_name', name);
                renderUserSummary();
                renderRecordsList();
            });

            buyerSelect.addEventListener('change', (e) => {
                if (e.target.value) {
                    buyerInput.value = e.target.value;
                    localStorage.setItem('my_buyer_name', e.target.value);
                    renderUserSummary();
                    renderRecordsList();
                }
            });

            addRowBtn.addEventListener('click', addNewItemRow);

            multiPurchaseForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const buyerName = buyerInput.value.trim();
                if (!buyerName) {
                    showToast("お名前を入力してください", "fa-triangle-exclamation text-amber-400");
                    return;
                }

                const rows = document.querySelectorAll('.item-row');
                const itemsToSave = [];

                rows.forEach(row => {
                    const itemName = row.querySelector('.item-name').value.trim();
                    const price = parseFloat(row.querySelector('.item-price').value) || 0;
                    const qty = parseInt(row.querySelector('.item-qty').value) || 1;

                    if (itemName) {
                        itemsToSave.push({ 
                            id: 'rec_' + Date.now() + Math.random().toString(36).substring(2, 6),
                            buyer: buyerName, 
                            item: itemName, 
                            adminItem: itemName, 
                            price, 
                            qty, 
                            createdAt: new Date().toISOString()
                        });
                    }
                });

                if (itemsToSave.length === 0) {
                    showToast("商品名を入力してください", "fa-triangle-exclamation text-amber-400");
                    return;
                }

                itemsToSave.forEach(rec => {
                    if (window.saveRecordToCloud) {
                        window.saveRecordToCloud(activeRoomId, rec);
                    }
                });

                const existing = getRoomRecords(activeRoomId);
                const updated = [...itemsToSave, ...existing];
                saveRoomRecords(activeRoomId, updated);

                resetForm();
                showToast(`${itemsToSave.length}件の注文を登録しました！`, "fa-circle-check text-emerald-400");
            });

            document.getElementById('createNewRoomBtn').addEventListener('click', openCreateRoomModal);
            document.getElementById('copySummaryBtn').addEventListener('click', copySummaryToClipboard);
            document.getElementById('exportCsvBtn').addEventListener('click', exportToCsv);
            filterBuyer.addEventListener('change', renderRecordsList);

            window.addEventListener('firebase-ready', () => {
                const dot = document.getElementById('syncStatusDot');
                const text = document.getElementById('syncStatusText');
                if (dot) dot.className = "inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
                if (text) text.textContent = "リアルタイム同期中";
                loadRoomData(activeRoomId);
            });

            window.addEventListener('firebase-error', () => {
                const dot = document.getElementById('syncStatusDot');
                const text = document.getElementById('syncStatusText');
                if (dot) dot.className = "inline-block w-2 h-2 rounded-full bg-amber-500";
                if (text) text.textContent = "オフライン (ローカル保存)";
            });
        }

        function copySummaryToClipboard() {
            if (records.length === 0) {
                showToast("データがありません", "fa-triangle-exclamation text-amber-400");
                return;
            }

            const currentRoomObj = availableRooms.find(r => r.id === activeRoomId);
            const roomName = currentRoomObj ? currentRoomObj.name : 'メインルーム';

            let text = `【注文集計結果 - ルーム: ${roomName}】\n`;
            const personMap = {};
            let grandTotal = 0;

            records.forEach(r => {
                const sub = r.price * r.qty;
                grandTotal += sub;
                if (!personMap[r.buyer]) personMap[r.buyer] = { total: 0, items: [] };
                personMap[r.buyer].total += sub;
                personMap[r.buyer].items.push(`${r.adminItem || r.item} (¥${r.price}×${r.qty})`);
            });

            for (const [person, data] of Object.entries(personMap)) {
                text += `\n■ ${person} 様: ¥${data.total.toLocaleString()}\n`;
                data.items.forEach(item => {
                    text += `  ・${item}\n`;
                });
            }

            text += `\n================\n総合計: ¥${grandTotal.toLocaleString()}`;

            copyTextToClipboard(text);
            showToast("LINE用集計テキストをコピーしました！", "fa-copy text-emerald-400");
        }

        function exportToCsv() {
            if (records.length === 0) {
                showToast("データがありません", "fa-triangle-exclamation text-amber-400");
                return;
            }

            let csvContent = "\uFEFF購入者名,商品名,単価,数量,小計\n";
            records.forEach(r => {
                const subtotal = r.price * r.qty;
                csvContent += `"${r.buyer}","${r.item}",${r.price},${r.qty},${subtotal}\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `summary_${activeRoomId}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            showToast("CSVを出力しました", "fa-file-csv text-blue-400");
        }

        function copyTextToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            try { document.execCommand('copy'); } catch (err) {}
            document.body.removeChild(textArea);
        }

        function showModal({ title, body, actions }) {
            const modal = document.getElementById('customModal');
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalBody').innerHTML = body;

            const actionsContainer = document.getElementById('modalActions');
            actionsContainer.innerHTML = '';

            actions.forEach(action => {
                const btn = document.createElement('button');
                btn.textContent = action.label;
                let btnClass = "flex-1 py-2.5 rounded-xl text-xs font-bold transition-all active:scale-95 ";
                if (action.type === 'primary') {
                    btnClass += "bg-blue-600 text-white shadow-md shadow-blue-500/20 hover:bg-blue-700";
                } else if (action.type === 'danger') {
                    btnClass += "bg-rose-600 text-white shadow-md shadow-rose-500/20 hover:bg-rose-700";
                } else {
                    btnClass += "bg-slate-100 text-slate-700 hover:bg-slate-200";
                }
                btn.className = btnClass;
                btn.onclick = action.onClick;
                actionsContainer.appendChild(btn);
            });

            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('customModal').classList.add('hidden');
        }

        function showToast(msg, iconClass) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.textContent = msg;
            toastIcon.className = `fa-solid ${iconClass || 'fa-circle-check text-emerald-400'}`;

            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');

            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, function (m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }
    </script>
</body>
</html>
