    <!-- Firebase SDK Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Firebase Configuration setup
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'nijiiro-group-order';
        let firebaseConfig = null;
        if (typeof __firebase_config !== 'undefined') {
            try { firebaseConfig = JSON.parse(__firebase_config); } catch (e) {}
        }

        let db = null;
        let auth = null;

        if (firebaseConfig && firebaseConfig.apiKey && firebaseConfig.apiKey !== "demo-key") {
            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
            } catch (e) {
                console.warn("Firebase init failed:", e);
            }
        }

        window.firebaseDb = db;
        window.firebaseAuth = auth;
        window.appId = appId;

        // BroadcastChannel for Tab-to-Tab Local Sync when Firebase is offline/not configured
        const localBroadcast = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('nijiiro_sync_channel') : null;

        if (localBroadcast) {
            localBroadcast.onmessage = (event) => {
                if (event.data && event.data.roomId === window.activeRoomId) {
                    if (window.onLocalSyncCallback) {
                        window.onLocalSyncCallback(getRoomRecords(window.activeRoomId));
                    }
                }
            };
        }

        // Firebase Auth Promise
        window.authReadyPromise = new Promise((resolve) => {
            if (!auth) {
                resolve(null);
                return;
            }
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    resolve(user);
                } else {
                    const initAuth = async () => {
                        try {
                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                await signInWithCustomToken(auth, __initial_auth_token);
                            } else {
                                await signInAnonymously(auth);
                            }
                        } catch (e) {
                            console.warn("Auth init fallback:", e);
                            resolve(null);
                        }
                    };
                    initAuth();
                }
            });
        });

        // Realtime Subscription with Firestore & Local Sync Fallback
        window.subscribeToRoomRealtime = async function(roomId, onDataReceived) {
            window.onLocalSyncCallback = onDataReceived;

            if (window.unsubscribeRoom) {
                window.unsubscribeRoom();
                window.unsubscribeRoom = null;
            }

            const dot = document.getElementById('syncStatusDot');
            const text = document.getElementById('syncStatusText');

            const user = await window.authReadyPromise;

            if (!user || !window.firebaseDb) {
                if (dot) dot.className = "inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse";
                if (text) text.textContent = "リアルタイム同期中 (ローカル/タブ連携)";
                onDataReceived(getRoomRecords(roomId));
                return;
            }

            const colRef = collection(window.firebaseDb, 'artifacts', window.appId, 'public', 'data', `room_${roomId}`);

            if (dot) dot.className = "inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
            if (text) text.textContent = "クラウドリアルタイム同期中";

            window.unsubscribeRoom = onSnapshot(colRef, (snapshot) => {
                const fetchedRecords = [];
                snapshot.forEach((docSnap) => {
                    fetchedRecords.push(docSnap.data());
                });
                fetchedRecords.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
                saveRoomRecords(roomId, fetchedRecords);
                onDataReceived(fetchedRecords);
            }, (error) => {
                console.warn("Firestore error fallback:", error);
                if (dot) dot.className = "inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse";
                if (text) text.textContent = "同期中 (ローカル)";
                onDataReceived(getRoomRecords(roomId));
            });
        };

        window.saveRecordToCloud = async function(roomId, record) {
            let savedCloud = false;
            try {
                await window.authReadyPromise;
                if (window.firebaseDb) {
                    const docRef = doc(window.firebaseDb, 'artifacts', window.appId, 'public', 'data', `room_${roomId}`, record.id);
                    await setDoc(docRef, record);
                    savedCloud = true;
                }
            } catch (e) {
                console.error("Cloud save failed:", e);
            }

            // Local storage update & broadcast
            const records = getRoomRecords(roomId);
            records.unshift(record);
            saveRoomRecords(roomId, records);
            if (localBroadcast) {
                localBroadcast.postMessage({ type: 'UPDATE', roomId });
            }
            return savedCloud;
        };

        window.deleteRecordFromCloud = async function(roomId, recordId) {
            let deletedCloud = false;
            try {
                await window.authReadyPromise;
                if (window.firebaseDb) {
                    const docRef = doc(window.firebaseDb, 'artifacts', window.appId, 'public', 'data', `room_${roomId}`, recordId);
                    await deleteDoc(docRef);
                    deletedCloud = true;
                }
            } catch (e) {
                console.error("Cloud delete failed:", e);
            }

            // Local storage update & broadcast
            const records = getRoomRecords(roomId).filter(r => r.id !== recordId);
            saveRoomRecords(roomId, records);
            if (localBroadcast) {
                localBroadcast.postMessage({ type: 'DELETE', roomId });
            }
            return deletedCloud;
        };
    </script>

            <!-- 7. 左上 (紫) -->
            <g transform="translate(58, 52) scale(0.65)">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#805ad5"/>
            </g>

            <!-- 中央メインアイコン（黒フチ付きの丸型スマイル） -->
            <g transform="translate(120,120)">
                <!-- 外枠黒ライン -->
                <circle cx="0" cy="0" r="54" fill="#e53e3e" stroke="#1a202c" stroke-width="8"/>

                <!-- Clip Path for Top Stripes -->
                <clipPath id="circleClip">
                    <circle cx="0" cy="0" r="50"/>
                </clipPath>

                <g clip-path="url(#circleClip)">
                    <!-- 上部斜線ストライプ (ピンク, 黄, 紺) -->
                    <path d="M-60 -50 L60 -50 L60 -15 L-60 -15 Z" fill="#e53e3e"/>
                    <line x1="-30" y1="-55" x2="-5" y2="-15" stroke="#f687b3" stroke-width="12"/>
                    <line x1="-10" y1="-55" x2="15" y2="-15" stroke="#f6e05e" stroke-width="12"/>
                    <line x1="10" y1="-55" x2="35" y2="-15" stroke="#1a365d" stroke-width="12"/>

                    <!-- 中央黒帯 -->
                    <rect x="-60" y="-18" width="120" height="36" fill="#1a202c"/>

                    <!-- 白文字 N -->
                    <text x="0" y="10" font-family="'Inter', sans-serif" font-weight="900" font-style="italic" font-size="34" fill="#ffffff" text-anchor="middle">N</text>

                    <!-- 下部スマイル口元 -->
                    <path d="M-24 28 Q0 48 24 28" fill="none" stroke="#1a202c" stroke-width="6" stroke-linecap="round"/>
                    <line x1="-27" y1="26" x2="-21" y2="30" stroke="#1a202c" stroke-width="6" stroke-linecap="round"/>
                    <line x1="27" y1="26" x2="21" y2="30" stroke="#1a202c" stroke-width="6" stroke-linecap="round"/>
                </g>
            </g>
        </svg>
        `;

        function setupIcons() {
            const svgUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(rainbowLogoSvg);
            document.getElementById('lockAppLogo').innerHTML = rainbowLogoSvg;
            document.getElementById('headerAppLogo').innerHTML = rainbowLogoSvg;
            document.getElementById('faviconIcon').href = svgUrl;

            const img = new Image();
            img.src = svgUrl;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = 180;
                canvas.height = 180;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, 180, 180);
                ctx.drawImage(img, 0, 0, 180, 180);
                document.getElementById('appleTouchIcon').href = canvas.toDataURL('image/png');
            };
        }

        // Passcodes
        const USER_PASSCODE = "0516";
        const ADMIN_PASSCODE = "1234";

        let currentMode = "user";
        let activeRoomId = "default";

        function getRoomRecords(roomId) {
            const stored = localStorage.getItem(`nijiiro_room_${roomId}`);
            return stored ? JSON.parse(stored) : [];
        }
        function saveRoomRecords(roomId, records) {
            localStorage.setItem(`nijiiro_room_${roomId}`, JSON.stringify(records));
        }

        function showToast(msg, iconClass = "fa-circle-check text-emerald-400") {
            const toast = document.getElementById('toastNotification');
            const toastMsg = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.textContent = msg;
            toastIcon.className = `fa-solid ${iconClass}`;

            toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
            }, 3000);
        }

        function addNewItemRow() {
            const container = document.getElementById('itemRowsContainer');
            const rowId = 'row_' + Date.now() + Math.random().toString(36).substring(2, 5);

            const row = document.createElement('div');
            row.className = "item-row flex items-center gap-2 bg-slate-50 p-2.5 rounded-2xl border border-slate-200";
            row.id = rowId;
            row.innerHTML = `
                <div class="flex-1">
                    <input type="text" class="item-name w-full px-3 py-1.5 bg-white border border-slate-200 rounded-xl text-xs font-medium focus:outline-none focus:border-indigo-500" placeholder="商品名" required>
                </div>
                <div class="w-20">
                    <input type="number" class="item-price w-full px-2 py-1.5 bg-white border border-slate-200 rounded-xl text-xs font-medium text-right focus:outline-none focus:border-indigo-500" placeholder="単価" min="0" required>
                </div>
                <div class="w-16">
                    <input type="number" class="item-qty w-full px-2 py-1.5 bg-white border border-slate-200 rounded-xl text-xs font-medium text-center focus:outline-none focus:border-indigo-500" value="1" min="1" required>
                </div>
                <button type="button" class="remove-row-btn p-2 text-slate-400 hover:text-rose-500 transition-all">
                    <i class="fa-solid fa-trash-can text-xs"></i>
                </button>
            `;

            container.appendChild(row);

            row.querySelector('.remove-row-btn').addEventListener('click', () => {
                if (document.querySelectorAll('.item-row').length > 1) {
                    row.remove();
                } else {
                    showToast("少なくとも1つの商品行が必要です", "fa-triangle-exclamation text-amber-400");
                }
            });
        }

        function renderRecords(records) {
            const tbody = document.getElementById('recordsTableBody');
            const emptyState = document.getElementById('emptyState');
            const totalText = document.getElementById('totalAmountText');

            tbody.innerHTML = '';
            let grandTotal = 0;

            if (!records || records.length === 0) {
                emptyState.classList.remove('hidden');
                totalText.textContent = '¥0';
                return;
            }

            emptyState.classList.add('hidden');

            records.forEach(rec => {
                const price = Number(rec.price) || 0;
                const qty = Number(rec.qty) || 1;
                const subtotal = price * qty;
                grandTotal += subtotal;

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50/80 transition-all";
                tr.innerHTML = `
                    <td class="p-3 font-bold text-slate-800">${escapeHtml(rec.buyer)}</td>
                    <td class="p-3 text-slate-700 font-medium">${escapeHtml(rec.item)}</td>
                    <td class="p-3 text-right text-slate-500">¥${price.toLocaleString()}</td>
                    <td class="p-3 text-center font-bold text-slate-700">${qty}</td>
                    <td class="p-3 text-right font-black text-indigo-600">¥${subtotal.toLocaleString()}</td>
                    <td class="p-3 text-center">
                        <button class="delete-record-btn p-1.5 text-slate-300 hover:text-rose-500 transition-all" data-id="${rec.id}">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </td>
                `;

                tr.querySelector('.delete-record-btn').addEventListener('click', async () => {
                    if (confirm('この注文を削除しますか？')) {
                        if (window.deleteRecordFromCloud) {
                            await window.deleteRecordFromCloud(activeRoomId, rec.id);
                        }
                        const current = getRoomRecords(activeRoomId).filter(r => r.id !== rec.id);
                        saveRoomRecords(activeRoomId, current);
                        showToast("注文を削除しました", "fa-circle-check text-emerald-400");
                    }
                });

                tbody.appendChild(tr);
            });

            totalText.textContent = `¥${grandTotal.toLocaleString()}`;
        }

        function escapeHtml(str) {
            return String(str || '').replace(/[&<>"']/g, match => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[match]);
        }

        function loadRoomData(roomId) {
            activeRoomId = roomId;
            const badge = document.getElementById('currentRoomBadge');
            badge.textContent = roomId === 'default' ? 'メイン' : roomId;

            if (window.subscribeToRoomRealtime) {
                window.subscribeToRoomRealtime(roomId, (fetchedRecords) => {
                    renderRecords(fetchedRecords);
                });
            } else {
                renderRecords(getRoomRecords(roomId));
            }
        }

        function updateModeUI() {
            const label = document.getElementById('modeToggleLabel');
            const adminSec = document.getElementById('adminControlSection');

            if (currentMode === 'admin') {
                label.textContent = "管理者モード";
                adminSec.classList.remove('hidden');
            } else {
                label.textContent = "一般モード";
                adminSec.classList.add('hidden');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            setupIcons();

            // LocalStorage Cross-Tab Listeners
            window.addEventListener('storage', (e) => {
                if (e.key === `nijiiro_room_${window.activeRoomId}`) {
                    renderRecords(getRoomRecords(window.activeRoomId));
                }
            });

            // URLパラメータからルームIDを取得
            const urlParams = new URLSearchParams(window.location.search);
            const roomParam = urlParams.get('room');
            if (roomParam) {
                activeRoomId = roomParam;
            }
            window.activeRoomId = activeRoomId;

            const isAuthed = sessionStorage.getItem('nijiiro_authed');
            if (isAuthed === 'true') {
                document.getElementById('passcodeLockOverlay').classList.add('hidden');
            }

            addNewItemRow();
            loadRoomData(activeRoomId);

            // Passcode Authentication
            document.getElementById('submitPasscodeBtn').addEventListener('click', () => {
                const val = document.getElementById('passcodeInput').value;
                if (val === USER_PASSCODE) {
                    sessionStorage.setItem('nijiiro_authed', 'true');
                    document.getElementById('passcodeLockOverlay').classList.add('hidden');
                    showToast("認証されました！", "fa-circle-check text-emerald-400");
                } else {
                    document.getElementById('passcodeError').classList.remove('hidden');
                }
            });

            // Admin Mode Authentication
            document.getElementById('modeToggleBtn').addEventListener('click', () => {
                if (currentMode === 'user') {
                    document.getElementById('adminAuthModal').classList.remove('hidden');
                } else {
                    currentMode = 'user';
                    updateModeUI();
                    showToast("一般モードに切り替えました", "fa-user text-indigo-400");
                }
            });

            document.getElementById('confirmAdminAuthBtn').addEventListener('click', () => {
                const val = document.getElementById('adminPasscodeInput').value;
                if (val === ADMIN_PASSCODE) {
                    currentMode = 'admin';
                    updateModeUI();
                    document.getElementById('adminAuthModal').classList.add('hidden');
                    document.getElementById('adminPasscodeInput').value = '';
                    showToast("管理者モードに入りました", "fa-user-shield text-amber-400");
                } else {
                    document.getElementById('adminPassError').classList.remove('hidden');
                }
            });

            document.getElementById('cancelAdminAuthBtn').addEventListener('click', () => {
                document.getElementById('adminAuthModal').classList.add('hidden');
            });

            document.getElementById('addRowBtn').addEventListener('click', addNewItemRow);

            document.getElementById('forceSyncBtn')?.addEventListener('click', () => {
                loadRoomData(activeRoomId);
                showToast("更新を実行しました", "fa-arrows-rotate text-indigo-400");
            });

            // Multi Purchase Submit Handler
            document.getElementById('multiPurchaseForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const buyer = document.getElementById('buyerInput').value.trim();
                if (!buyer) return;

                const rows = document.querySelectorAll('.item-row');
                const newItems = [];

                rows.forEach(row => {
                    const itemName = row.querySelector('.item-name').value.trim();
                    const price = parseFloat(row.querySelector('.item-price').value) || 0;
                    const qty = parseInt(row.querySelector('.item-qty').value) || 1;

                    if (itemName) {
                        newItems.push({
                            id: 'rec_' + Date.now() + Math.random().toString(36).substring(2, 6),
                            buyer,
                            item: itemName,
                            price,
                            qty,
                            createdAt: new Date().toISOString()
                        });
                    }
                });

                if (newItems.length === 0) return;

                for (const item of newItems) {
                    if (window.saveRecordToCloud) {
                        await window.saveRecordToCloud(activeRoomId, item);
                    }
                }

                // Reset Form
                document.getElementById('itemRowsContainer').innerHTML = '';
                addNewItemRow();

                showToast(`${newItems.length}件の注文を送信しました！`, "fa-circle-check text-emerald-400");
            });

            // Share Modal & URL Copy
            document.getElementById('shareRoomBtn').addEventListener('click', () => {
                const shareUrl = `${window.location.origin}${window.location.pathname}?room=${activeRoomId}`;
                document.getElementById('shareUrlText').textContent = shareUrl;
                document.getElementById('shareModal').classList.remove('hidden');
            });

            document.getElementById('closeShareModalBtn').addEventListener('click', () => {
                document.getElementById('shareModal').classList.add('hidden');
            });

            document.getElementById('copyShareUrlBtn').addEventListener('click', () => {
                const shareUrl = document.getElementById('shareUrlText').textContent;
                const tempInput = document.createElement('input');
                tempInput.value = shareUrl;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand('copy');
                document.body.removeChild(tempInput);
                showToast("共有リンクをコピーしました！", "fa-copy text-indigo-400");
            });

            // Room Selector
            document.getElementById('roomSelectBtn').addEventListener('click', () => {
                document.getElementById('roomSelectModal').classList.remove('hidden');
            });
            document.getElementById('closeRoomModalBtn').addEventListener('click', () => {
                document.getElementById('roomSelectModal').classList.add('hidden');
            });

            document.getElementById('createNewRoomBtn').addEventListener('click', () => {
                const roomName = document.getElementById('newRoomNameInput').value.trim();
                if (roomName) {
                    const newUrl = `${window.location.pathname}?room=${encodeURIComponent(roomName)}`;
                    window.history.pushState({}, '', newUrl);
                    activeRoomId = roomName;
                    window.activeRoomId = roomName;
                    loadRoomData(roomName);
                    document.getElementById('newRoomNameInput').value = '';
                    document.getElementById('roomSelectModal').classList.add('hidden');
                    showToast(`「${roomName}」に切り替えました`, "fa-door-open text-indigo-400");
                }
            });
        });
    </script>
</body>
</html>
